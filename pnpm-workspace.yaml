minimumReleaseAge: 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # slow-redact is pinned through pino -> @walletconnect/logger.
  - slow-redact@0.3.2
  - nanoid@3.3.14
blockExoticSubdeps: true
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  keccak: false
  sharp: false
  utf-8-validate: false
  workerd: false

overrides:
  # Old wallet SDKs pin vulnerable UUID and WebSocket releases.
  uuid@<11.1.1: 11.1.1
  ws@<8.21.0: 8.21.0
  # query-string 7 requires a CommonJS decoder; upgrade the parent together.
  query-string@<9.5.1: 9.5.1
  '@reown/appkit-adapter-wagmi>@wagmi/connectors': 6.2.0
  # relay-auth pins older releases rejected by trustPolicy: no-downgrade.
  '@walletconnect/relay-auth>@noble/curves': 1.8.1
  '@walletconnect/relay-auth>@noble/hashes': 1.7.1
  vite: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
